config_version = 14

[bar.default]
capsule = true
center = [ "launcher", "taskbar" ]
end = [
    "tray",
    "network",
    "notifications",
    "clipboard",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "clock"
]
margin_ends = 0
position = "bottom"
radius = 0
scale = 1.0500000081956387
start = [ "wallpaper", "media" ]
thickness = 55

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "cava", "foot", "gtk3", "gtk4", "qt" ]

[wallpaper]
directory = "/usr/share/wallpapers/"

    [wallpaper.default]
    path = "/usr/share/wallpapers/damavand/damavand-3.jpg"

    [wallpaper.last]
    path = "/usr/share/wallpapers/damavand/damavand-3.jpg"

    [wallpaper.monitors.DP-3]
    path = "/usr/share/wallpapers/damavand/damavand-3.jpg"

[widget.launcher]
capsule = true

[widget.taskbar]
icon_scale = 2.0
item_spacing = 5
pinned = [ "firefox", "foot", "thunar", "com.parchlinux.pastor" ]
pinned_opacity = 1.0